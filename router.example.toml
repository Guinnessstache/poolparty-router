# PoolParty Router settings. The app writes this file for you; this example
# shows every option.

[router]
# Point every tool at http://<this machine>:4000/v1 with model "auto".
# Add your Tailscale IP here to reach the router from other machines.
listen = ["127.0.0.1:4000"]
# api_key = "pick-a-long-random-string"   # clients then send it as a Bearer token
poll_seconds = 3
log_file = "router.log"

[nodes.local]
name = "This PC"
url = ""            # empty = the model this app runs (see [local_model])

[nodes.remote]
name = "Mac Studio"
url = "http://mac-studio:8080/v1"
# api_key = "same value as llama-server --api-key on the Mac"

[local_model]
model = ""          # path to a .gguf; pick one in the app
llama_server = ""   # empty = find it automatically
context = 16384
port = 8081
gpu_layers = 99
autostart = true

[escalation]
# "handoff": when a session is stuck, write a brief and tell you to continue
#            in Claude Code (covered by a Claude Pro or Max plan).
# "off":     never escalate.
mode = "handoff"
strikes_to_escalate = 3
summarize_with_local_model = true
