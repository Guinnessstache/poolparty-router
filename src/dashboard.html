<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PoolParty Router</title>
<style>
  :root {
    --bg: #f6f5f1; --panel: #ffffff; --ink: #1d1d1b; --quiet: #6b6a64; --line: #e3e1d9;
    --accent: #1f6feb; --good: #1a7f37; --warn: #b26a00; --bad: #c62828; --chip: #efede6;
    --mono: ui-monospace, "Cascadia Code", "SF Mono", Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #141412; --panel: #1d1d1a; --ink: #ecebe6; --quiet: #9b9a92; --line: #2f2e2a;
            --accent: #5b9dff; --good: #3fb950; --warn: #e3a336; --bad: #f47067; --chip: #2a2925; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 1080px; margin: 0 auto; padding: 24px 16px 48px; }
  header { display: flex; flex-wrap: wrap; align-items: baseline; gap: 8px 16px; margin-bottom: 20px; }
  h1 { font-size: 20px; margin: 0; }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--quiet);
       margin: 28px 0 10px; font-weight: 600; }
  .endpoint { font-family: var(--mono); font-size: 13px; background: var(--chip); padding: 3px 8px;
              border-radius: 6px; }
  .muted { color: var(--quiet); }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; }
  .card h3 { margin: 0 0 2px; font-size: 15px; display: flex; align-items: center; gap: 8px; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--quiet); flex: none; }
  .dot.on { background: var(--good); } .dot.off { background: var(--bad); } .dot.paused { background: var(--warn); }
  .kv { margin: 8px 0 0; display: grid; grid-template-columns: auto 1fr; gap: 2px 12px; font-size: 13px; }
  .kv dt { color: var(--quiet); } .kv dd { margin: 0; font-family: var(--mono); font-size: 12.5px;
           overflow-wrap: anywhere; }
  table { width: 100%; border-collapse: collapse; background: var(--panel); border: 1px solid var(--line);
          border-radius: 10px; overflow: hidden; }
  th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { font-size: 12px; color: var(--quiet); font-weight: 600; }
  tr:last-child td { border-bottom: 0; }
  td.num { font-family: var(--mono); font-size: 12.5px; white-space: nowrap; }
  .scroll { overflow-x: auto; }
  .empty { padding: 18px; text-align: center; color: var(--quiet); background: var(--panel);
           border: 1px dashed var(--line); border-radius: 10px; }
  button { font: inherit; font-size: 12.5px; border: 1px solid var(--line); background: var(--chip);
           color: var(--ink); border-radius: 6px; padding: 4px 10px; cursor: pointer; }
  button:hover { border-color: var(--quiet); }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .strikes { display: inline-flex; gap: 3px; vertical-align: middle; }
  .strikes i { width: 14px; height: 6px; border-radius: 3px; background: var(--line); }
  .strikes i.hit { background: var(--warn); }
  .reasons { margin: 4px 0 0; padding-left: 16px; color: var(--quiet); font-size: 12.5px; }
  .tag { font-size: 11.5px; padding: 1px 7px; border-radius: 10px; background: var(--chip);
         font-family: var(--mono); white-space: nowrap; }
  .tag.err { color: var(--bad); } .tag.handoff { color: var(--warn); }
  pre { margin: 8px 0 0; background: var(--chip); padding: 10px 12px; border-radius: 8px; overflow-x: auto;
        font: 12.5px/1.5 var(--mono); }
  .tabs { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
  .tabs button[aria-selected="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
  .row { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  #auth { display: none; margin-bottom: 16px; }
  input { font: inherit; padding: 5px 8px; border: 1px solid var(--line); border-radius: 6px;
          background: var(--panel); color: var(--ink); width: min(360px, 100%); }
  .toast { position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); background: var(--ink);
           color: var(--bg); padding: 6px 14px; border-radius: 8px; font-size: 13px; opacity: 0;
           transition: opacity .2s; pointer-events: none; }
  .toast.show { opacity: 1; }
</style>
</head>
<body>
<main>
  <header>
    <h1>PoolParty Router</h1>
    <span class="endpoint" id="endpoint"></span>
    <button id="copyEndpoint">Copy</button>
    <span class="muted" id="updated"></span>
  </header>

  <div class="card" id="auth">
    <div class="row"><strong>This router needs its API key</strong></div>
    <p class="muted">Paste the <code>api_key</code> from router.toml. It's kept in this browser only.</p>
    <input id="keyInput" type="password" placeholder="router api_key"> <button class="primary" id="saveKey">Save</button>
  </div>

  <div class="grid" id="nodes"></div>

  <h2>Sessions</h2>
  <div id="sessions"></div>

  <h2>Handoffs to Claude Code</h2>
  <div id="handoffs"></div>

  <h2>Recent requests</h2>
  <div id="activity"></div>

  <h2>Connect your tools</h2>
  <div class="card">
    <div class="tabs" role="tablist" id="tabs"></div>
    <div id="snippet"></div>
  </div>
</main>
<div class="toast" id="toast"></div>

<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let key = ""; try { key = localStorage.getItem("pp-router-key") || ""; } catch {}
const base = location.origin + "/v1";
$("endpoint").textContent = base + "  ·  model auto";

function toast(msg) { const t = $("toast"); t.textContent = msg; t.classList.add("show"); setTimeout(() => t.classList.remove("show"), 1600); }
async function copy(text) {
  try { await navigator.clipboard.writeText(text); toast("Copied"); }
  catch { const a = document.createElement("textarea"); a.value = text; document.body.appendChild(a); a.select();
          document.execCommand("copy"); a.remove(); toast("Copied"); }
}
$("copyEndpoint").onclick = () => copy(base);

async function api(path, body) {
  const opt = { headers: { "content-type": "application/json" } };
  if (key) opt.headers.authorization = "Bearer " + key;
  if (body !== undefined) { opt.method = "POST"; opt.body = JSON.stringify(body); }
  const r = await fetch(path, opt);
  if (r.status === 401) { $("auth").style.display = "block"; throw new Error("auth"); }
  $("auth").style.display = "none";
  return r.json();
}
$("saveKey").onclick = () => { key = $("keyInput").value.trim(); try { localStorage.setItem("pp-router-key", key); } catch {} refresh(); };

const LABEL = { mac: "Mac Studio M1 Ultra", jayspc: "jayspc RTX 4070 Ti" };
const ROLE = { mac: "Agents, chat, images", jayspc: "Tab completion, short chat" };

function nodeCard(n) {
  return `<div class="card"><h3><span class="dot ${n.online ? "on" : "off"}"></span>${esc(LABEL[n.name] || n.name)}</h3>
    <div class="muted">${ROLE[n.name] || ""}</div>
    <dl class="kv"><dt>Status</dt><dd>${n.online ? "online" : esc(n.last_error || "offline")}</dd>
    <dt>Model</dt><dd>${esc(n.model || "—")}</dd>
    <dt>Context</dt><dd>${n.n_ctx ? n.n_ctx.toLocaleString() + " tokens" : "—"}</dd>
    <dt>URL</dt><dd>${esc(n.url)}</dd></dl></div>`;
}

function claudeCard(e, count) {
  const paused = e.paused;
  return `<div class="card"><h3><span class="dot ${paused ? "paused" : "on"}"></span>Claude Code (your plan)</h3>
    <div class="muted">Takes over stuck sessions</div>
    <dl class="kv"><dt>Handoffs</dt><dd>${paused ? "paused" : "on, at " + e.strikes_to_escalate + " strikes"}</dd>
    <dt>Briefs</dt><dd>${count} saved</dd><dt>Folder</dt><dd>${esc(e.handoff_dir)}</dd></dl>
    <div style="margin-top:10px"><button id="toggleMode">${paused ? "Resume handoffs" : "Pause handoffs"}</button></div></div>`;
}

function strikes(n, max) {
  let s = '<span class="strikes" title="' + n + " of " + max + ' strikes">';
  for (let i = 0; i < max; i++) s += `<i class="${i < n ? "hit" : ""}"></i>`;
  return s + "</span>";
}

function render(d) {
  const max = d.escalation.strikes_to_escalate;
  $("nodes").innerHTML = d.nodes.map(nodeCard).join("") + claudeCard(d.escalation, d.handoffs.length);
  $("toggleMode").onclick = async () => { await api("/router/mode", { paused: !d.escalation.paused }); refresh(); };

  $("sessions").innerHTML = d.sessions.length ? `<div class="scroll"><table>
    <tr><th>Task</th><th>Strikes</th><th>Requests</th><th>Handoffs</th><th></th></tr>
    ${d.sessions.map(s => `<tr><td>${esc(s.task || "(no task text)")}
        ${s.reasons.length ? `<ul class="reasons">${s.reasons.map(r => `<li>${esc(r)}</li>`).join("")}</ul>` : ""}</td>
      <td>${strikes(Math.min(s.strikes, max), max)}</td><td class="num">${s.requests}</td><td class="num">${s.escalations}</td>
      <td style="white-space:nowrap"><button data-esc="${esc(s.id)}">Hand off</button>
        ${s.strikes ? `<button data-reset="${esc(s.id)}">Clear</button>` : ""}</td></tr>`).join("")}
    </table></div>` : `<div class="empty">No sessions yet. Point a coding agent at the endpoint above.</div>`;
  document.querySelectorAll("[data-esc]").forEach(b => b.onclick = async () => {
    await api("/router/escalate", { session: b.dataset.esc }); toast("Hands off on its next request"); refresh(); });
  document.querySelectorAll("[data-reset]").forEach(b => b.onclick = async () => {
    await api("/router/reset", { session: b.dataset.reset }); refresh(); });

  $("handoffs").innerHTML = d.handoffs.length ? `<div class="scroll"><table>
    <tr><th>Brief</th><th>Written</th><th></th></tr>
    ${d.handoffs.map((h, i) => `<tr><td class="num">${esc(h.name)}</td><td class="num">${esc(h.modified)}</td>
      <td><button data-cmd="${i}">Copy Claude command</button></td></tr>`).join("")}</table></div>`
    : `<div class="empty">No handoffs yet.</div>`;
  document.querySelectorAll("[data-cmd]").forEach(b => b.onclick = () => copy(d.handoffs[+b.dataset.cmd].command));

  $("activity").innerHTML = d.activity.length ? `<div class="scroll"><table>
    <tr><th>Time</th><th>Kind</th><th>Went to</th><th>Rule</th><th>Status</th><th>~Tokens</th><th>Time to start</th></tr>
    ${d.activity.map(a => `<tr><td class="num">${esc(a.time)}</td><td>${esc(a.kind || "")}</td>
      <td><span class="tag ${a.route === "claude-code" ? "handoff" : ""}">${esc(a.route)}</span></td>
      <td>${esc(a.rule)}</td><td><span class="tag ${a.status >= 400 ? "err" : ""}">${a.status}</span></td>
      <td class="num">${a.est_tokens.toLocaleString()}</td><td class="num">${a.ms} ms</td></tr>`).join("")}</table></div>`
    : `<div class="empty">No requests yet.</div>`;

  $("updated").textContent = "v" + d.version + " · updated " + new Date().toLocaleTimeString();
}

const SNIPPETS = {
  "OpenCode": () => ["Save as opencode.json in your project (or ~/.config/opencode/opencode.json):",
    JSON.stringify({ "$schema": "https://opencode.ai/config.json",
      provider: { poolparty: { npm: "@ai-sdk/openai-compatible", name: "PoolParty",
        options: Object.assign({ baseURL: base }, key ? { apiKey: key } : {}),
        models: { auto: { name: "PoolParty auto" } } } },
      model: "poolparty/auto" }, null, 2)],
  "Pi": () => ["Add a provider to Pi's models.json (in its agent folder, usually ~/.pi/agent/):",
    JSON.stringify({ providers: { poolparty: { baseUrl: base, api: "openai-completions",
      apiKey: key || "none", models: [{ id: "auto", name: "PoolParty auto" }] } } }, null, 2)],
  "Unsloth Studio": () => ["Add connection → llama.cpp (or Custom) → Base URL:", base],
  "Kilo Code / Continue": () => ["Provider: OpenAI Compatible", `Base URL: ${base}\nModel: auto\nAPI key: ${key || "(anything)"}\n\nFor tab completion in Continue, set the autocomplete model to\n"jayspc" with the same base URL.`],
};
let tab = "OpenCode";
function renderTabs() {
  $("tabs").innerHTML = Object.keys(SNIPPETS).map(t => `<button role="tab" aria-selected="${t === tab}" data-tab="${esc(t)}">${esc(t)}</button>`).join("");
  document.querySelectorAll("[data-tab]").forEach(b => b.onclick = () => { tab = b.dataset.tab; renderTabs(); });
  const [note, code] = SNIPPETS[tab]();
  $("snippet").innerHTML = `<div class="row"><span class="muted">${esc(note)}</span><button id="copySnip">Copy</button></div><pre>${esc(code)}</pre>`;
  $("copySnip").onclick = () => copy(code);
}

async function refresh() { try { render(await api("/status")); renderTabs(); } catch (e) { if (e.message !== "auth") $("updated").textContent = "router not reachable"; } }
renderTabs(); refresh(); setInterval(refresh, 2000);
</script>
</body>
</html>
