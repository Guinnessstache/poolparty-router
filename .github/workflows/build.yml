name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked
      - run: cargo build --release --locked
      - name: Package
        shell: pwsh
        run: |
          $out = "PoolParty-Router"
          New-Item -ItemType Directory -Force $out, "$out/mac", "$out/scripts" | Out-Null
          Copy-Item target/release/poolparty-router.exe "$out/PoolParty Router.exe"
          Copy-Item README.md, LICENSE, router.example.toml, SETUP-AND-TEST.cmd, STOP.cmd $out
          Copy-Item mac/* "$out/mac"
          Copy-Item scripts/setup-and-test.ps1 "$out/scripts"
          Compress-Archive -Path "$out/*" -DestinationPath PoolParty-Router-windows-x64.zip -Force
      - uses: actions/upload-artifact@v4
        with:
          name: PoolParty-Router-windows-x64
          path: PoolParty-Router-windows-x64.zip
      - name: Release when the version is new
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ver = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          $tag = "v$ver"
          gh release view $tag 2>$null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "$tag already released; nothing to do."
            exit 0
          }
          gh release create $tag PoolParty-Router-windows-x64.zip `
            --target "$env:GITHUB_SHA" --title "PoolParty Router $ver" --generate-notes `
            --notes "Download **PoolParty-Router-windows-x64.zip** below, unzip it anywhere and open **PoolParty Router**. Windows will say the app is unsigned: choose More info, then Run anyway."
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
